  <div id="cover" style="display:flex;justify-content:center;gap:4px;height:84px"></div>
  <div class="ln">南山校園輕小說 RPG</div>
  <h1>我的校園生活<br>就是這麼自強不息！</h1>
  <div class="subt">～成為南山豹的我，這一年也太充實了吧～</div>
  <div class="sub">從 7 月入學到 6 月結業，依南山真實行事曆走過一整年。想讀南山的小六生，也可以先來體驗國中部的生活！</div>

</div></div>

<script>
(()=>{
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
document.getElementById('keys').innerHTML = isTouch
  ? '👈 左下搖桿：移動<br>👉 右下按鈕：跳／💬 對話<br>⭐ 走進發光圈圈開始任務<br>🎵 升旗台旁的校歌碑可以聽校歌'
  : '⌨️ WASD／方向鍵：移動　Shift：衝刺　空白鍵：跳<br>💬 E：和主任、校長對話（進辦公室）<br>⭐ 走進發光圈圈開始任務<br>🎵 升旗台旁的校歌碑可以聽校歌';
if(isTouch){ document.getElementById('joy').style.display='block'; document.getElementById('jump').style.display='block'; document.getElementById('hint').style.display='none'; }

/* ================= HD-2D 引擎（Canvas 2D 斜俯視：建物立體、景深、柔光、光束） ================= */
const $=id=>document.getElementById(id);
const canvas=$('c'),ctx=canvas.getContext('2d');
const HOOK={ground:[],actors:[],overlay:[],screen:[],update:[],map:[]};
const FONT='"Huninn","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif';
const K=1.8;            // 校園放大倍率（比 3D 版寬 1.8 倍）
const HS=.46,TILT=.74;  // 建物高度比例、地面俯視壓縮
const ZS=1.2;           // 南北向拉長倍率（老師 2026-11-06）：座標資料不變，畫面、走路時間、地圖的南北向都拉長 1.2 倍
let DPR=1,VW=0,VH=0,PPU=20;
// 畫質：QUAL 是玩家的選擇（auto 自動／high／mid／low，記在本機），QLV 是實際等級（2 高、1 中、0 低）
let QUAL='auto';try{QUAL=localStorage.getItem('nanshan-q')||'auto';}catch(e){}
let QLV=QUAL==='high'?2:QUAL==='mid'?1:QUAL==='low'?0:((navigator.hardwareConcurrency||8)<=4?1:2);
const PX=x=>x*PPU,PY=(z,y=0)=>z*PPU*TILT*ZS-y*HS*PPU;
function rr(x,X,Y,w,h,r){r=Math.min(r,w/2,h/2);x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
const hexRGB=h=>{h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
function shade(h,f){const [r,g,b]=hexRGB(h);const m=v=>Math.max(0,Math.min(255,Math.round(f<1?v*f:v+(255-v)*(f-1))));return `rgb(${m(r)},${m(g)},${m(b)})`;}

let mgOn=null,mgRAF=0;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function miniGame(cfg,onWin,onQuit){
  paused=true;keys={};joyV.x=joyV.y=0;
  $('mgT').textContent=cfg.title;$('mgP').textContent=cfg.prompt;
  $('mg').classList.remove('hidden');

  const stop=()=>{cancelAnimationFrame(mgRAF);mgOn=null;};
  const end=()=>{stop();$('mg').classList.add('hidden');onWin();};
  $('mgQ').onclick=()=>{stop();$('mg').classList.add('hidden');paused=false;canvas.focus();onQuit&&onQuit();};
  const start=()=>{stop();A.innerHTML='';$('mgS').textContent='';MG[cfg.kind](cfg,A,end);};

}
const MG={
  order(cfg,A,end){
    let k=0;const seq=document.createElement('div');seq.className='seq';A.appendChild(seq);
    const box=document.createElement('div');box.className='ord';A.appendChild(box);
    shuffle(cfg.items.map((t,i)=>({t,i}))).forEach(o=>{
      const b=document.createElement('button');b.textContent=o.t;
      b.onclick=()=>{
        if(o.i===k){b.className='ok';b.disabled=true;k++;sfx(k===cfg.items.length?'win':'step+');seq.innerHTML=cfg.items.slice(0,k).map((x,i)=>`${i+1}. ${x}`).join('<br>');
          $('mgS').textContent=k<cfg.items.length?`✔ 第 ${k} 步正確`:'✅ 全部完成！';
          if(k===cfg.items.length)setTimeout(end,800);}
        else{b.className='no';sfx('wrong');$('mgS').textContent='❌ 這不是下一步，再想想看。';setTimeout(()=>{if(b.className==='no')b.className='';},450);}
      };box.appendChild(b);
    });
  },
  timing(cfg,A,end){
    let hits=0,miss=0,x=0,dir=1,zs=0,done=false;const zw=cfg.zone||.2,sp=cfg.speed||1;
    A.innerHTML=`<div class="bar"><div class="zone"></div><div class="needle"></div></div><button class="btn main big">${cfg.btn||'按！'}</button>`;
    const zone=A.querySelector('.zone'),nd=A.querySelector('.needle'),B=A.querySelector('.big');
    const newZone=()=>{zs=.08+Math.random()*(.84-zw);zone.style.left=zs*100+'%';zone.style.width=zw*100+'%';};newZone();
    const st=()=>{$('mgS').textContent=`命中 ${hits} / ${cfg.hits}`+(miss?`　失誤 ${miss}`:'');};st();
    let last=performance.now();
    const tick=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;x+=dir*dt*.85*sp;if(x>1){x=1;dir=-1;}if(x<0){x=0;dir=1;}nd.style.left=`calc(${x*100}% - 3px)`;mgRAF=requestAnimationFrame(tick);};
    mgRAF=requestAnimationFrame(tick);
    const hit=()=>{if(done)return;
      if(x>=zs-.01&&x<=zs+zw+.01){hits++;sfx(hits>=cfg.hits?'win':'hit');zone.style.background='#3fcf6a';setTimeout(()=>zone.style.background='',160);
        if(hits>=cfg.hits){done=true;$('mgS').textContent='✅ 完美！';setTimeout(end,700);return;}newZone();}
      else{miss++;sfx('miss');nd.style.background='#999';setTimeout(()=>nd.style.background='',160);}
      st();};
    B.onpointerdown=e=>{e.preventDefault();hit();};mgOn={key:hit};
  },
  mash(cfg,A,end){
    let v=0,time=cfg.time,done=false;
    A.innerHTML=`<div class="bar"><div class="fill"></div></div><div class="tm"></div><button class="btn main big">${cfg.btn||'連打！'}</button>`;
    const f=A.querySelector('.fill'),tm=A.querySelector('.tm'),B=A.querySelector('.big');
    let last=performance.now();
    const tick=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;if(done)return;
      time-=dt;v=Math.max(0,v-dt*(cfg.decay||4));f.style.width=Math.min(100,v/cfg.need*100)+'%';tm.textContent=`⏱ ${Math.max(0,time).toFixed(1)} 秒`;
      if(v>=cfg.need){done=true;sfx('win');$('mgS').textContent='✅ 成功！';setTimeout(end,700);return;}
      if(time<=0){done=true;sfx('timeup');$('mgS').textContent='⏰ 時間到！按「重來」再試一次。';return;}
      mgRAF=requestAnimationFrame(tick);};
    mgRAF=requestAnimationFrame(tick);
    const hit=()=>{if(!done){v+=1;sfx('tap');B.style.transform='scale(.96)';setTimeout(()=>B.style.transform='',60);}};
    B.onpointerdown=e=>{e.preventDefault();hit();};mgOn={key:hit};
  },
  memory(cfg,A,end){
    const cards=shuffle(cfg.pairs.flatMap((p,i)=>[{t:p[0],i},{t:p[1],i}]));
    const g=document.createElement('div');g.className='mem';A.appendChild(g);
    let open=[],left=cfg.pairs.length,lock=false,tries=0;
    $('mgS').textContent=`找出 ${left} 組配對`;
    cards.forEach(c=>{
      const b=document.createElement('button');b.innerHTML=`<span>${c.t}</span>`;c.b=b;
      b.onclick=()=>{
        if(lock||b.classList.contains('up')||b.classList.contains('done'))return;
        b.classList.add('up');open.push(c);sfx('flip');
        if(open.length===2){tries++;lock=true;const [a,d]=open;
          if(a.i===d.i){setTimeout(()=>{a.b.className='done';d.b.className='done';open=[];lock=false;left--;sfx(left?'match':'win');
              $('mgS').textContent=left?`配對成功！還剩 ${left} 組`:`✅ 全部配對完成（翻了 ${tries} 次）`;if(!left)setTimeout(end,800);},300);}
          else setTimeout(()=>{sfx('miss');a.b.classList.remove('up');d.b.classList.remove('up');open=[];lock=false;},850);}
      };g.appendChild(b);
    });
  },
};

 tech:{who:'生活科技老師',intro:'生活科技老師：生活科技教室有很多手工具和機器，用得好可以做出很棒的作品，用錯了也很危險。先來認識〈生科教室管理辦法〉！',
  outro:'生活科技老師：沒錯！工具用完歸位、機器不用就關電源、有問題馬上問老師。下課前別忘了「整潔七大步」，椅子要倒扣在桌上喔！',pool:[
  {q:'下課時間想進生活科技教室拿東西，可以嗎？',o:['不行，要經過老師同意才能進入專科教室','可以，門沒鎖就能進','可以，只要快去快回','可以，請同學幫忙開門'],ex:'〈生科教室管理辦法〉：嚴禁學生擅自進入專科教室，必須經由老師同意才可以進入。'},
  {q:'機器正在運轉，發現上面有木屑，應該？',o:['先關掉電源、等機器停止，再清理','直接用手撥掉','用身體擋住讓它停下來','邊轉邊用抹布擦'],ex:'〈生科教室管理辦法〉：機器運轉時不可以做清潔、調整或修理，也不可用身體或手去停止機器。'},
  {q:'操作機器時聽到奇怪的聲音、聞到怪味，應該？',o:['立刻停止機器，報告老師','開大一點蓋過聲音','繼續做完再說','換一台機器偷偷用'],ex:'〈生科教室管理辦法〉：機器操作時如有異味或異響，要立即停止機器並報告任課老師。'},
  {q:'鋸子用完了，應該怎麼做？',o:['放回原處，課後交給班長清點','借給隔壁組不用還','帶回家繼續做作品','放在地上就好'],ex:'〈生科教室管理辦法〉手工具使用安全規範：工具用完放回原處，不可拿他組工具，嚴禁帶出教室；下課由班長（小老師）清點數量。'},
  {q:'第一次使用新的手工具前，要先做什麼？',o:['先參加工具的安全課程','直接拿來用','上網看影片就好','叫同學示範一次'],ex:'〈生科教室管理辦法〉：工具使用前，需先參與使用的安全課程，並依正確方法操作。'},
  {q:'生活科技教室下課前，椅子要怎麼放？',o:['倒扣在桌上，擺整齊','隨便放就好','疊在門口','推到走廊'],ex:'〈專科教室實作後整潔七大步〉：工具放回盆子、桌面擦乾淨、抹布對折晾好、椅子倒扣在桌上、工作服扣好排整齊。'}]},
 pe:{who:'體育老師',intro:'體育老師：第一堂體育課，先說明上課須知！依〈南山中學體育課程授課辦法〉，我們一起把規矩記清楚，運動才安全。',
  outro:'體育老師：記住了！穿運動服、先熱身、器材借了要還。體適能每學年檢測一次，平常多動一動，成績自然會進步！',pool:[
  {q:'體育課應該穿什麼？',o:['學校運動服（也可以穿南山應援 T），下課換回學校服裝','背心和垮褲最涼快','穿制服和皮鞋','穿什麼都可以'],ex:'〈體育課程授課辦法〉：上課服裝以校內運動服為主，可以穿南山應援 T，但禁止背心、垮褲；下課要換回學校服裝。'},
  {q:'體育課可以帶什麼喝的？',o:['飲用水或運動飲料，用來補充水分','手搖飲料','泡麵','零食和汽水'],ex:'〈體育課程授課辦法〉：上課不可以飲食，補充水分用的飲用水或運動飲料除外；上課中也不能去福利社買東西。'},
  {q:'上體育課前，身上的哪些東西要先拿下來？',o:['耳環、手環、項鍊、手錶等飾品','運動鞋','學號','眼鏡帶'],ex:'〈體育課程授課辦法〉：課程中不可配戴耳環、手環、項鍊、手錶等飾品，避免受傷。'},
  {q:'體育課的球要怎麼借？',o:['由股長在上課前到器材室登記領取，下課後 5 分鐘內歸還','下課自己進器材室拿','借回家練習','誰先搶到就是誰的'],ex:'〈體育器材借用辦法〉：體育課由股長在上課前到器材室領取、填登記表，下課後 5 分鐘內歸還；借還時都要檢查有沒有損壞。'},
  {q:'開始上課，第一件事是？',o:['體健股長集合整隊、回報人數，然後做熱身運動','直接開始比賽','先去福利社','找陰涼的地方坐著'],ex:'〈體育課程授課辦法〉：上課準時、定點集合，由體健股長整隊並回報人數；課前一定要確實做熱身運動。'},
  {q:'體育成績是怎麼算的？',o:['技能 50%、認知 20%、學習態度 30%','只看跑得快不快','只看出席','只看比賽輸贏'],ex:'〈體育科課程目標與評鑑方式〉：運動技能 50%，運動規則與常識（認知）20%，學習態度與同儕互動（情意）30%。'},
  {q:'體適能檢測多久做一次？',o:['每學年一次，在 9 到 11 月','每天都要測','畢業才測','不用測'],ex:'〈體育課程授課辦法〉：體適能每學年檢測一次，9 月到 11 月完成。'}]},
 health:{who:'護理師',intro:'護理師：歡迎來到健康中心！身體不舒服或受傷都可以來找我們。今天是衛教小站，3 題健康常識考考你！',
  outro:'護理師：答得好！勤洗手、多喝水、均衡飲食、讓眼睛休息，就是最好的保健。每學期還有身高、體重和視力檢查，記得配合喔！',pool:[
  {q:'正確洗手的步驟口訣是？',o:['內、外、夾、弓、大、立、腕','沖一下水就好','只洗手心','用衣服擦一擦'],ex:'疾病管制署「濕、搓、沖、捧、擦」，搓手時照著「內、外、夾、弓、大、立、腕」，至少搓 20 秒。（衛生組〈手部衛生與咳嗽禮節〉）'},
  {q:'在教室突然想打噴嚏，應該？',o:['用手帕、衛生紙或衣袖遮住口鼻','對著同學打','用手掌遮住再去摸門把','憋住不打'],ex:'衛生組〈手部衛生與咳嗽禮節〉：咳嗽、打噴嚏要用手帕、衛生紙或衣袖遮住口鼻；有呼吸道症狀要戴口罩，並勤洗手。'},
  {q:'頭痛去健康中心，可以跟護理師拿止痛藥吃嗎？',o:['不行，健康中心只提供外用藥，不提供內服藥','可以，想拿多少都行','可以，拿回家給家人','可以，順便打針'],ex:'〈健康中心管理〉：健康中心只供應外用藥物，學生不得要求護理師給予內服藥；需要時會聯絡家長。'},
  {q:'正在長高的青少年，想讓骨骼強壯，可以多吃什麼？',o:['牛奶、小魚乾、豆腐','汽水','炸雞和薯條','糖果'],ex:'衛生組〈青少年飲食原則〉：鈣是製造骨骼和牙齒的原料，要多攝取牛奶、小魚乾、豆腐等含鈣和蛋白質的食物，並按時吃三餐。'},
  {q:'打完球流了很多汗，應該？',o:['多喝水補充水分，到陰涼處休息','馬上喝冰汽水','繼續在大太陽下跑','不用管它'],ex:'衛生組〈青少年飲食原則〉〈熱傷害〉：運動流汗要多喝水；天氣熱時注意休息，預防熱傷害。'},
  {q:'怎麼預防登革熱？',o:['清除家裡和教室旁的積水容器','多吃冰品','把窗戶全部打開','不用預防'],ex:'衛生組〈傳染病衛教〉：登革熱由病媒蚊傳播，要「巡、倒、清、刷」，把積水容器清掉，蚊子就沒地方產卵。'},
  {q:'學校每學期都會幫大家做哪些健康檢查？',o:['身高、體重和視力','抽血驗 DNA','拔牙','打預防針'],ex:'衛生組〈學生健康管理及體位、視力檢查〉：每學期篩檢身高、體重和視力，及早發現問題、及早矯治。'},
  {q:'看平板、手機一段時間後，眼睛該怎麼辦？',o:['休息一下、看看遠方，做做伸展','繼續看，越近越清楚','把螢幕調到最暗','躺著看比較舒服'],ex:'衛生組〈3C 手機症候群〉：低頭族容易眼睛疲勞、肩頸痠痛，用一段時間就要讓眼睛休息、看遠方，起來做做伸展操。'}]},
 library:{who:'圖書館老師',intro:'圖書館老師：歡迎來到自強大樓七樓的圖書館！這裡是教學資源中心，可以借書、借電子書、找資料，還有很多閱讀活動。來試試 3 題「圖書館利用教育」！',
  outro:'圖書館老師：答得好！多來圖書館走走，一學期借滿 10 本就有閱讀認證，三年借滿 100 本還能挑戰「南山百閱獎」喔！',pool:[
  {q:'南山的圖書館在哪裡？',o:['自強大樓七樓','熊祥大樓一樓','行健樓地下室','校門口警衛室'],ex:'圖書館和教學資源中心都在自強大樓七樓；八樓還有大閱覽室。'},
  {q:'想知道圖書館有沒有某一本書，最快的方法是？',o:['用「館藏查詢系統」查書名，記下索書號','每個書架一排一排找','直接去書店買','問班上同學'],ex:'官網「南山圖書館」頁面有館藏查詢系統，查到索書號就能照號碼到書架找書。'},
  {q:'「南山百閱獎」要怎麼拿到？',o:['國中或高中三年借書累計 100 本以上，再寫一篇 500–1000 字推薦文','一次借 100 本','考試考 100 分','把書捐給圖書館'],ex:'〈南山百閱獎活動辦法〉：三年內借書累計百本以上，並從借過的書中寫一篇 500–1000 字推薦文，就能獲頒「南山百閱獎」，在全校集會公開表揚。'},
  {q:'一學期借閱 31 本以上的圖書，可以得到什麼閱讀認證？',o:['金牌閱讀王','好讀小學士','銀牌閱讀王','什麼都沒有'],ex:'〈南山百閱獎活動辦法〉：每學期借 10–20 本是「好讀小學士」、21–30 本是「銀牌閱讀王」、31 本以上是「金牌閱讀王」，認證會登錄在學習護照。'},
  {q:'下面哪一種借閱，也會算進百閱獎的借書統計？',o:['用南山 HyRead、Udn 讀書館借的電子書','在書店站著看的書','網路上的短影片','同學借給你的漫畫'],ex:'〈南山百閱獎活動辦法〉：圖書、雜誌、電子書都列入統計（電子書指南山 HyRead、南山 Udn 讀書館）；隨借隨還的不算。'},
  {q:'「早安悅讀」是什麼活動？',o:['早上的晨讀時間，全班安靜讀自己選的書或共讀書','早上邊吃早餐邊聊天','早上到操場跑步','早上考小考'],ex:'〈早安悅讀計畫〉：推動持續安靜閱讀，學期初由圖書股長到七樓圖書館領取共讀書箱，讀完還能得到閱讀認證。'},
  {q:'想在假日到學校閱覽室自習，要先做什麼？',o:['先上網預約，到校時帶學生證、穿校服、刷卡進校','直接翻牆進來','穿便服就好','打電話叫警衛開門'],ex:'〈圖書館閱覽室自習使用辦法〉：先上「閱覽室預約系統」預約（每週四前），自習要帶學生證、穿校服、刷卡進校；預約沒到累計三次就不能再使用。'},
  {q:'學校的刊物《南山雜誌》，哪裡可以看到？',o:['學校 igt 平台上的電子書，從 1987 年創刊一路出版到現在','只有校長室有','只能在書店買','已經停刊了'],ex:'《南山雜誌》1987 年創刊，到現在已經出版四百多期，可以在南山 igt 平台看電子書，還有「心靈時雨」等專欄。'},
  {q:'管理員考一題：《論語》「學而時習之，不亦說乎」的「說」是什麼意思？',o:['喜悅','說話','解說','勸說'],ex:'「說」通「悅」，讀ㄩㄝˋ，喜悅的意思。'}]},
 digital:{who:'教學資源中心老師',intro:'教學資源中心老師：下學期開始囉！除了課本，南山還有很多數位學習平台，在家也能預習、複習、練英文。來認識一下吧！',
  outro:'教學資源中心老師：太好了！這些平台都整理在官網的「學生」專區，用學校給的帳號登入。帳號密碼要自己保管好，不要借給別人喔！',pool:[
  {q:'南山自己的數位學習平台叫什麼？',o:['南山數位學習中心（AILEAD365）','南山遊戲中心','南山購物網','南山直播台'],ex:'官網「學生」專區的「南山數位學習中心」使用 AILEAD365 平台，用學校帳號登入，建議使用 Google Chrome 瀏覽器。'},
  {q:'想在家練英文聽說讀寫，還能玩英文遊戲，可以用哪個平台？',o:['Cool English 英語線上學習平台','購物網站','電玩遊戲','影音直播'],ex:'官網有「COOL ENGLISH」專頁和說明檔，是教育部的英語線上學習平台，聽、說、讀、寫和遊戲都有。'},
  {q:'「翰林雲端學院」可以拿來做什麼？',o:['看教學影片、做線上測驗','買文具','聊天交友','訂便當'],ex:'官網「翰林雲端學院」專頁有平台連結和操作說明，可以看教學影片、做線上測驗。'},
  {q:'想找學校推薦的數位學習平台，例如因材網、均一、PaGamO、酷課雲，要去哪裡找？',o:['官網「學生」專區的數位學習連結','路邊的廣告','陌生人傳的連結','遊戲論壇'],ex:'官網「學生」專區整理了南山數位學習中心、因材網、均一教育平台、PaGamO、酷課雲、Learnmode 學習吧等連結。'},
  {q:'想複習以前的段考試題和教材電子書，可以去哪裡看？',o:['官網「學生」專區的「段考試題」「教材電子書」（igt 平台）','把考卷丟掉就好','問網路上的陌生人','去網咖找'],ex:'官網「學生」專區有「段考試題」「教材電子書」，放在南山的 igt 雲端平台上。'},
  {q:'學校數位平台的帳號密碼，應該怎麼處理？',o:['自己保管好，不借給別人，也不要輸入到奇怪的網站','貼在教室布告欄','借給同學幫忙做作業','傳到班級群組'],ex:'帳號密碼是你的數位身分證，自己保管好；收到要你輸入帳密的陌生連結，先問老師或家長。'}]},

function readBook(){ // 數位學習與閱讀（依官網學生專區、南山圖書館、閱覽室預約系統）
  const A=(t,u)=>DEMO?`<b>${t}</b>`:`<a href="${u}" target="_blank" rel="noopener">${t}</a>`;
  dialog({title:'💻 數位學習與閱讀',por:ICON_SCHOOL,html:`<div class="gl">
<div class="oinfo"><b>📚 圖書館（自強大樓七樓・教學資源中心）</b><br>借書、借電子書（南山 HyRead、Udn 讀書館），用${A('館藏查詢系統','https://libraryopac.nssh.ntpc.edu.tw/WEBOPAC/Jycx.aspx?dc=1&fc=1&n=7')}找書。每月有《圖書館訊》，還有閱讀心得與小論文寫作比賽。${A('南山圖書館','https://www.nssh.ntpc.edu.tw/p/412-1000-314.php?Lang=zh-tw')}</div>

function askMulti(t){
  const bank=QBANK[G];let pool=bank.filter(q=>!QDONE.has(q.id));if(pool.length<3)pool=bank.slice();
  const qs=shuffle(pool).slice(0,3);let k=0;const title=T(t.title);
  const next=()=>{
    if(k>=qs.length){STARS++;dialog({title,text:`三題全部答對！⭐ 獲得一顆星（目前 ${STARS} 顆）。\n星星會記在集章冊和紀念卡上。`,btn:'太好了！',onDone:()=>complete(t)});return;}
    const q=qs[k],ord=shuffle(q.o.map((o,i)=>i));
    dialog({title:`${title}（${k+1}/3）`,text:`【${q.s}】${q.q}`,opts:ord.map(i=>q.o[i]),ans:ord.indexOf(q.a),ex:q.ex,onDone:()=>{QDONE.add(q.id);k++;next();},onClose:()=>{t.cool=true;}});
  };

}

/* ---------- 校慶大隊接力 ---------- */
MG.relay=function(cfg,A,end){
  let leg=0,phase='run',v=0,time=cfg.time,x=0,dir=1,zs=.4,done=false;const legs=cfg.legs||4,zw=.22;
  A.innerHTML=`<div class="tm rl"></div><div class="bar"><div class="fill"></div><div class="zone" style="display:none"></div><div class="needle" style="display:none"></div></div><div class="tm rt"></div><button class="btn main big"></button>`;
  const lg=A.querySelector('.rl'),f=A.querySelector('.fill'),zone=A.querySelector('.zone'),nd=A.querySelector('.needle'),tm=A.querySelector('.rt'),B=A.querySelector('.big');
  const setPhase=p=>{phase=p;if(p==='run'){v=0;zone.style.display=nd.style.display='none';f.style.display='block';B.textContent='🏃 跑！';}
    else{zs=.1+Math.random()*(.8-zw);zone.style.left=zs*100+'%';zone.style.width=zw*100+'%';zone.style.display=nd.style.display='block';f.style.display='none';B.textContent='🤝 交棒！';}
    lg.textContent=`第 ${leg+1} / ${legs} 棒　${p==='run'?'連打衝刺！':'在綠色區交棒！'}`;};
  setPhase('run');let last=performance.now();
  const tick=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;if(done)return;time-=dt;
    if(phase==='run'){v=Math.max(0,v-dt*2.5);f.style.width=Math.min(100,v/cfg.need*100)+'%';if(v>=cfg.need)setPhase('pass');}
    else{x+=dir*dt*1.1;if(x>1){x=1;dir=-1;}if(x<0){x=0;dir=1;}nd.style.left=`calc(${x*100}% - 3px)`;}
    tm.textContent=`⏱ ${Math.max(0,time).toFixed(1)} 秒`;
    if(time<=0){done=true;sfx('timeup');$('mgS').textContent='⏰ 時間到！按「重來」再跑一次。';return;}
    mgRAF=requestAnimationFrame(tick);};
  mgRAF=requestAnimationFrame(tick);
  const hit=()=>{if(done)return;
    if(phase==='run'){v+=1;sfx('tap');B.style.transform='scale(.96)';setTimeout(()=>B.style.transform='',60);}
    else if(x>=zs-.01&&x<=zs+zw+.01){leg++;sfx(leg>=legs?'cheer':'hit');if(leg>=legs){done=true;$('mgS').textContent='✅ 衝過終點線！';setTimeout(end,800);return;}$('mgS').textContent='👍 交棒成功！';setPhase('run');}
    else{time-=1.5;sfx('miss');$('mgS').textContent='😵 掉棒了！扣 1.5 秒';}};
  B.onpointerdown=e=>{e.preventDefault();hit();};mgOn={key:hit};
};

/* ---------- 音效與背景音樂（Web Audio 即時合成，不需要音檔） ---------- */
let AC=null,SFXG=null,MUSG=null,SND=1; // 1 音樂＋音效、2 只有音效、0 靜音
try{const v=localStorage.getItem('nanshan-snd');if(v!==null)SND=+v;}catch(e){}
function audioInit(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
    const M=AC.createDynamicsCompressor();M.connect(AC.destination);SFXG=AC.createGain();MUSG=AC.createGain();SFXG.connect(M);MUSG.connect(M);setInterval(musTick,90);if(typeof BG!=='undefined'&&BG.cur)bgmNode(BG.cur);}
  if(AC.state==='suspended')AC.resume();applySnd();}
function applySnd(){bgmSync();if(SFXG){SFXG.gain.value=SND?0.55:0;MUSG.gain.value=SND===1?0.18:0;}$('sndbtn').textContent=SND===1?'🔊 音樂':SND===2?'🔉 音效':'🔇 靜音';}
function tone(f,t0,d,{type='sine',g=.3,dest=SFXG,f2=0,a=.006}={}){const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  v.gain.setValueAtTime(0,t0);v.gain.linearRampToValueAtTime(g,t0+a);v.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(v);v.connect(dest);o.start(t0);o.stop(t0+d+.05);}
let NOISE=null;
function noise(t0,d,{g=.2,fq=1200,q=1,type='bandpass',dest=SFXG}={}){if(!NOISE){NOISE=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const c=NOISE.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;}
  const s=AC.createBufferSource();s.buffer=NOISE;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=fq;f.Q.value=q;const v=AC.createGain();v.gain.setValueAtTime(g,t0);v.gain.exponentialRampToValueAtTime(.0001,t0+d);
  s.connect(f);f.connect(v);v.connect(dest);s.start(t0,Math.random()*.5);s.stop(t0+d+.05);}

  switch(n){
   case 'click':tone(880,t,.06,{type:'triangle',g:.12});break;
   case 'correct':tone(659.25,t,.12,{type:'triangle',g:.25});tone(987.77,t+.1,.3,{type:'triangle',g:.25});break;
   case 'wrong':tone(220,t,.25,{type:'square',g:.07,f2:170});break;
   case 'coin':tone(987.77,t,.08,{type:'square',g:.07});tone(1318.5,t+.07,.32,{type:'square',g:.07});break;
   case 'complete':[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,t+i*.08,.38,{type:'triangle',g:.2}));break;
   case 'stamp':tone(120,t,.28,{g:.6,f2:50});noise(t,.12,{g:.35,fq:420,type:'lowpass'});break;
   case 'jump':tone(320,t,.18,{g:.14,f2:640});break;
   case 'land':noise(t,.08,{g:.18,fq:320,type:'lowpass'});break;
   case 'grass':noise(t,.07,{g:.07,fq:1700,q:.7});break;
   case 'tile':noise(t,.04,{g:.08,fq:3200,q:2});tone(190,t,.04,{g:.04});break;
   case 'discover':[783.99,1046.5,1318.5].forEach((f,i)=>tone(f,t+i*.09,.32,{g:.14}));break;
   case 'ach':[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,t+i*.07,.45,{type:'triangle',g:.17}));break;
   case 'bell':[659.25,523.25,587.33,392,392,587.33,659.25,523.25].forEach((f,i)=>tone(f,t+i*.42,1.2,{g:.13}));break; // 上課鐘聲（西敏寺鐘聲）
   case 'page':noise(t,.2,{g:.14,fq:2600,q:.5});break;
   case 'type':tone(1150+Math.random()*250,t,.018,{type:'square',g:.018});break;
   case 'hit':tone(880,t,.08,{type:'triangle',g:.2});tone(1318.5,t+.05,.12,{type:'triangle',g:.15});break;
   case 'miss':tone(196,t,.18,{type:'sawtooth',g:.05,f2:150});break;
   case 'tap':tone(500+Math.random()*120,t,.05,{type:'square',g:.05});noise(t,.03,{g:.06,fq:2400});break;
   case 'flip':noise(t,.08,{g:.12,fq:3000,q:.8});tone(700,t,.05,{type:'triangle',g:.06});break;
   case 'match':tone(783.99,t,.12,{type:'triangle',g:.18});tone(1046.5,t+.08,.22,{type:'triangle',g:.18});break;
   case 'step+':tone(659.25+Math.random()*80,t,.12,{type:'triangle',g:.16});break;
   case 'win':[523.25,659.25,783.99,1046.5,783.99,1046.5].forEach((f,i)=>tone(f,t+i*.09,.4,{type:'triangle',g:.18}));break;
   case 'timeup':[392,349.23,293.66].forEach((f,i)=>tone(f,t+i*.16,.3,{type:'square',g:.06}));break;
   case 'cheer':for(let i=0;i<6;i++)noise(t+i*.07,.5,{g:.12,fq:900+Math.random()*900,q:.6});[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,t+i*.1,.5,{type:'triangle',g:.15}));break;
   case 'open':tone(440,t,.1,{g:.08,f2:660});noise(t,.08,{g:.05,fq:3500});break;
   case 'gate':tone(150,t,.35,{type:'sawtooth',g:.03,f2:120});noise(t,.25,{g:.06,fq:600,q:3});break;
   case 'chirp':[0,.12,.24].forEach(d=>tone(2600+Math.random()*900,t+d,.07,{g:.035,f2:3400}));break;
   case 'cicada':noise(t,1.6,{g:.022,fq:5200,q:8});break;
   case 'rain':noise(t,2.2,{g:.045,fq:900,q:.4,type:'lowpass'});break;
   case 'alarm':for(let i=0;i<4;i++)tone(620,t+i*.7,.65,{type:'sawtooth',g:.045,f2:940});break; // 地震警報

    const dx=a.tx-a.x,dz=a.tz-a.z,d=Math.hypot(dx,dz);if(d<.4){a.tx=0;a.w=1+Math.random()*4;return;}const nx=a.x+dx/d*3.2*dt,nz=a.z+dz/d*3.2*dt;if(blocked(nx,nz)){a.tx=0;return;}a.x=nx;a.z=nz;}
  else if(a.k==='jog'){a.a+=dt*.32;a.x=(-38+Math.cos(a.a)*14)*K;a.z=(37+Math.sin(a.a)*7)*K;}

function showPhoto(name){const p=PHOTOS[name];if(!p)return;dialog({title:'📷 '+name,por:ICON_SCHOOL,html:`<img class="cardimg" src="${p.src}" alt="${name}"><div class="oinfo" style="margin-top:6px">${p.cap||''}</div>`,btn:'繼續探險'});}
function album(){const all=Object.keys(PHOTOS),got=all.filter(n=>VISITED.has(n));
  dialog({title:'📷 南山相簿',por:ICON_SCHOOL,html:all.length?`<div class="oinfo">走訪地點就能解鎖實景照片：${got.length} / ${all.length}</div><div class="badges">${all.map(n=>VISITED.has(n)?`<div class="badge on" data-ph="${n}" style="cursor:pointer"><img src="${PHOTOS[n].src}" style="width:100%;border-radius:8px" alt="">${n}</div>`:`<div class="badge"><b>🔒</b>${n}</div>`).join('')}</div>`:'<div class="oinfo">走訪校園就能解鎖實景照片。照片由學校提供，準備中！</div>',btn:'關閉'});
  document.querySelectorAll('[data-ph]').forEach(x=>x.onclick=()=>{close();showPhoto(x.dataset.ph);});}
// 走到新地點：提示＋音效（有照片就顯示）
let visN=-1;
HOOK.update.push(()=>{if(!$('start').classList.contains('hidden')){visN=-1;return;}if(visN<0){visN=VISITED.size;return;}
  if(VISITED.size>visN){const name=[...VISITED].pop();visN=VISITED.size;if(BINFO.some(B=>B.name===name)){sfx('discover');toast(`🧭 發現新地點：${name}（探索 ${BINFO.filter(B=>VISITED.has(B.name)).length} / ${BINFO.length}）`,2600);if(PHOTOS[name]&&!paused)setTimeout(()=>{if(!paused)showPhoto(name);},700);}}});

/* ---------- 字型載入後重畫招牌與名牌 ---------- */
if(document.fonts&&document.fonts.load)document.fonts.load('16px Huninn','南山豹自強不息').then(f=>{if(!f.length)return;
  Object.keys(GTXT_CV).forEach(k=>delete GTXT_CV[k]);resize();setupTasks();setupNPCs(month);
  OFFNPC.forEach(n=>{n.tag=n.kind==='leader'?tagCanvas(`${n.d.title}・${n.d.name}`,'rgba(150,110,20,.95)'):tagCanvas(`${n.d.name}・${n.d.dir}`,'rgba(140,59,46,.92)');});
  BUDDY.forEach(b=>b.tag=tagCanvas('同班・'+b.name,'rgba(216,120,40,.95)',12));}).catch(()=>{});

/* ---------- 選單 ---------- */
function openMenu(){
  if(paused)return;sfx('open');
  dialog({title:'☰ 選單',por:ICON_SCHOOL,html:`<div class="menu">
<button data-m="stamp">📒 集章冊</button><button data-m="find">🔎 找地點</button><button data-m="off">🏢 處室名冊</button><button data-m="floor">📍 樓層導覽</button>
<button data-m="song">🎵 校歌</button><button data-m="gloss">📖 南山小辭典</button><button data-m="course">📚 特色課程</button><button data-m="read">💻 數位學習與閱讀</button><button data-m="qual">🎨 畫質</button><button data-m="cred">🎬 製作群</button><button data-m="honor">🏅 南山榮譽榜</button><button data-m="tour">🏫 360° 導覽</button>
<button data-m="map">🗺️ 校園地圖</button><button data-m="hist">🏛️ 校史時光碑</button><button data-m="ach">🏆 成就徽章</button><button data-m="album">📷 南山相簿</button><button data-m="reset">🔄 重新開始</button></div>`.replace(/\n/g,''),btn:'關閉'});
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const m=b.dataset.m;close();
    if(m==='stamp')stampBook();else if(m==='find')findPlace();else if(m==='off')officeDirectory();else if(m==='floor')floorGuide();else if(m==='song')showAnthem();
    else if(m==='gloss')glossary();else if(m==='course')courseBook();else if(m==='read')readBook();else if(m==='qual')qualityMenu();else if(m==='cred')credits();else if(m==='map')bigMap();else if(m==='hist')historyBook();else if(m==='ach')achBook();else if(m==='album')album();else if(m==='honor')$('coins').click();else if(m==='tour')window.open('https://my.matterport.com/show/?m=Z6YwRxKy3kZ','_blank','noopener');
    else if(m==='reset'){dialog({title:'🔄 重新開始',por:ICON_SCHOOL,html:'<div class="oinfo">確定要清除進度、回到開始畫面嗎？集章、星星和榮譽都會歸零。</div><button class="btn" id="rsok" style="width:100%">確定，重新開始</button>',btn:'不要，繼續玩'});$('rsok').onclick=()=>{clearSave();location.reload();};}});
}
$('menubtn').addEventListener('click',openMenu);
$('findbtn').addEventListener('click',findPlace);

resize();setupTasks();renderHud();cam.x=pos.x;cam.z=pos.z;requestAnimationFrame(loop);
$('cover').innerHTML=svgMarkup(charShapes(pantherCfg('m'),'front',0),'0 0 32 48',84)+svgMarkup(charShapes(pantherCfg('f'),'front',0),'0 0 32 48',84);
let pickG='j',pickX='m';
const GDESC={v:'🔍 給想讀南山的小六生：用國一新生的身分，體驗南山國中部一整年的課程、社團和活動，最後拿到一張體驗紀念卡。',j:'🎒 國中部課程：國文、英語、數學、社會（歷史・地理・公民）、自然（生物）、外師英文；亮點計畫、童軍教育、國一科學能力培養實驗、生物實驗課，還有才藝選修與多元運動選修。',
 s:'📘 高中部課程：國文、英文、數學、歷史、公民、基礎物理、基礎地科；校訂必修（國際素養教育、科學方法導論）、20 門多元選修、專題研究、第二外語選修、自主學習，還有才藝與多元運動選修。'};
const showG=()=>{$('gdesc').textContent=GDESC[pickG]+(pickG==='v'?'':'（國中、高中兩條路線的任務與課程完全不同）');};showG();
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{pickG=b.dataset.g;document.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('sel',x===b));showG();});
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{pickX=b.dataset.x;document.querySelectorAll('[data-x]').forEach(x=>x.classList.toggle('sel',x===b));});
let pickL='full';
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{pickL=b.dataset.l;document.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('sel',x===b));});
const selPick=(attr,v)=>document.querySelectorAll(`[data-${attr}]`).forEach(x=>{if(x.dataset[attr]===v)x.click();});
function start(g,x,sv){audioInit();VISIT=g==='v';G=VISIT?'j':g;SEX=x;P=makeChar(pantherCfg(x),3.2);
  if(sv){QUICK=!!sv.quick;setupTasks();$('start').classList.add('hidden');applySave(sv);enterMonth(sv.month);}
  else{QUICK=pickL==='quick';setupTasks();$('start').classList.add('hidden');clearSave();enterMonth(0);if(tutWanted())tutStart();}}
$('go').onclick=()=>start(pickG,pickX);
$('credlink').onclick=e=>{e.preventDefault();credits();};
$('demolink').textContent=DEMO?'🚪 結束展示模式':'🏫 展示模式（擺攤用）';
$('demolink').onclick=e=>{e.preventDefault();const u=new URL(location.href);if(DEMO)u.searchParams.delete('demo');else u.searchParams.set('demo','1');location.href=u.toString();};
if(DEMO){const bd=document.createElement('div');bd.className='demob';bd.textContent='🏫 展示模式・不存檔・閒置 90 秒自動重來';$('start').querySelector('.box').prepend(bd);
  selPick('g','v');selPick('l','quick');const fs=$('fsbtn');fs.style.display='block';
  fs.onclick=()=>{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d);};}
{const sv=DEMO?null:loadSave();if(sv){const b=$('cont');b.style.display='block';b.textContent=`↺ 繼續上次進度（${sv.visit||sv.VISIT?'小六體驗':sv.G==='j'?'國一':'高一'}・${MONTHS[sv.month].name.split('・')[0]}${sv.quick?'・快速體驗':''}）`;b.onclick=()=>start(sv.VISIT?'v':sv.G,sv.SEX,sv);}}
})();
</script>
